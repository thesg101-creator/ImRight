<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>ImRight - Prediction Tracker</title>
    <link rel="icon" type="image/x-icon" href="that.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 120vh;
            position: relative;        
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(147, 51, 234, 0.55), rgba(249, 115, 22, 0.75));
            overflow: visible;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
        }

        .header {
            padding-top: 2px;
            padding-bottom: 6px;
            text-align: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: white;
            font-family: 'Courier New', monospace;
        }

        .predictions-list {
            flex: 1;
            overflow: hidden;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .prediction-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            min-height: 55px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        .prediction-row:active {
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
            transform: scale(0.98);
        }

        .prediction-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .prediction-title {
            font-size: 13px;
            font-weight: 600;
            color: white;
            word-break: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .prediction-date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
        }

        .prediction-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 14px;
            flex-shrink: 0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .fab {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            font-size: 22px;
            color: pirple;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            z-index: 20;
            -webkit-appearance: none;
            appearance: none;
        }

        .fab:active {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-50%) scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 350px;
            width: 85%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            color: white;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        .context-menu {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 500;
            min-width: 160px;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: none;
            color: white;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-appearance: none;
            appearance: none;
        }

        .context-menu button:last-child {
            border-bottom: none;
        }

        .context-menu button:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .context-menu button.delete {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Predictions</h1>
        </div>

        <div class="predictions-list" id="predictionsList">
            <div class="empty-state">No predictions yet. Create one to get started!</div>
        </div>
    </div>

    <button class="fab" id="addBtn" title="Add new prediction">+</button>

    <!-- New Prediction Modal -->
    <div class="modal" id="newPredictionModal">
        <div class="modal-content">
            <div class="modal-header">New Prediction</div>
            <form id="predictionForm">
                <div class="form-group">
                    <label for="titleInput">Prediction</label>
                    <input type="text" id="titleInput" placeholder="Enter your prediction" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closePredictionModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <button onclick="markCorrect(currentPredictionId)">✅ Mark Correct</button>
        <button onclick="markIncorrect(currentPredictionId)">❌ Mark Incorrect</button>
        <button onclick="markPending(currentPredictionId)">⏳ Mark Pending</button>
        <button class="delete" onclick="deletePrediction(currentPredictionId)">🗑️ Delete</button>
    </div>

    <script>
        let currentPredictionId = null;
        let predictions = [];

        const statusEmojis = {
            '✅': '✅',
            '❌': '❌',
            '⏳': '⏳'
        };

        // Prevent zoom on input focus
        document.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'INPUT') {
                e.target.style.fontSize = '16px';
            }
        });

        // Load predictions from storer.json with localStorage fallback
        async function loadPredictions() {
            try {
                const response = await fetch('storer.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data && Array.isArray(data)) {
                        predictions = data;
                        localStorage.setItem('predictions', JSON.stringify(predictions));
                        return;
                    }
                }
            } catch (error) {
                console.warn('Failed to load from storer.json, falling back to localStorage:', error);
            }

            const saved = localStorage.getItem('predictions');
            if (saved) {
                try {
                    predictions = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse localStorage predictions:', e);
                    predictions = [];
                }
            }
        }

        // Save predictions to both storer.json and localStorage
        async function savePredictions() {
            localStorage.setItem('predictions', JSON.stringify(predictions));

            try {
                await fetch('storer.json', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(predictions)
                });
            } catch (error) {
                console.warn('Failed to save to storer.json, changes saved to localStorage only:', error);
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Render predictions
        function renderPredictions() {
            const list = document.getElementById('predictionsList');
            
            if (predictions.length === 0) {
                list.innerHTML = '<div class="empty-state">No predictions yet. Create one to get started!</div>';
                return;
            }

            list.innerHTML = predictions.map((prediction) => `
                <div class="prediction-row" onclick="showContextMenu(event, '${prediction.id}')">
                    <div class="prediction-content">
                        <div class="prediction-title">${escapeHtml(prediction.title)}</div>
                        <div class="prediction-date">${formatDate(prediction.created)}</div>
                    </div>
                    <div class="prediction-icon">${statusEmojis[prediction.status]}</div>
                </div>
            `).join('');
        }

        // Show context menu
        function showContextMenu(event, id) {
            event.preventDefault();
            currentPredictionId = id;
            const menu = document.getElementById('contextMenu');
            menu.classList.add('active');
        }

        // Hide context menu
        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('active');
        }

        // Mark prediction as correct
        function markCorrect(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '✅';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Mark prediction as incorrect
        function markIncorrect(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '❌';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Mark prediction as pending
        function markPending(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '⏳';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Delete prediction
        function deletePrediction(id) {
            if (confirm('Delete this prediction?')) {
                predictions = predictions.filter(p => p.id !== id);
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Haptic feedback (vibration on supported devices)
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        // Open new prediction modal
        document.getElementById('addBtn').addEventListener('click', () => {
            document.getElementById('newPredictionModal').classList.add('active');
            setTimeout(() => {
                document.getElementById('titleInput').focus();
            }, 100);
        });

        // Close modal
        function closePredictionModal() {
            document.getElementById('newPredictionModal').classList.remove('active');
        }

        // Handle form submission
        document.getElementById('predictionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('titleInput').value.trim();

            if (title) {
                predictions.push({
                    id: Date.now().toString(),
                    title: title,
                    created: new Date().toISOString(),
                    status: '⏳'
                });

                savePredictions();
                renderPredictions();
                triggerHaptic();

                document.getElementById('titleInput').value = '';
                closePredictionModal();
            }
        });

        // Close modal when clicking outside
        document.getElementById('newPredictionModal').addEventListener('click', (e) => {
            if (e.target.id === 'newPredictionModal') {
                closePredictionModal();
            }
        });

        // Close context menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.prediction-row') && !e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        // Initialize
        loadPredictions().then(() => {
            renderPredictions();
        });
    </script>
</body>
</html>
