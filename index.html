<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImRight - Prediction Tracker</title>
    <link rel="icon" type="image/x-icon" href="that.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(147, 51, 234, 0.55), rgba(249, 115, 22, 0.75));
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding-top: 50px;
            padding-bottom: 20px;
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: white;
            font-family: 'Courier New', monospace;
        }

        .predictions-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-top: 30px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .predictions-list::-webkit-scrollbar {
            width: 6px;
        }

        .predictions-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .predictions-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .prediction-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            min-height: 72px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .prediction-row:hover {
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .prediction-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .prediction-title {
            font-size: 16px;
            font-weight: 600;
            color: white;
            word-break: break-word;
        }

        .prediction-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .prediction-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 18px;
            flex-shrink: 0;
        }

        .prediction-row .actions {
            display: none;
            position: absolute;
            right: 20px;
            gap: 8px;
            z-index: 100;
        }

        .prediction-row:hover .actions {
            display: flex;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .action-btn.correct {
            background: rgba(34, 197, 94, 0.7);
        }

        .action-btn.correct:hover {
            background: rgba(34, 197, 94, 1);
        }

        .action-btn.incorrect {
            background: rgba(239, 68, 68, 0.7);
        }

        .action-btn.incorrect:hover {
            background: rgba(239, 68, 68, 1);
        }

        .action-btn.pending {
            background: rgba(249, 115, 22, 0.7);
        }

        .action-btn.pending:hover {
            background: rgba(249, 115, 22, 1);
        }

        .action-btn.delete {
            background: rgba(107, 114, 128, 0.7);
        }

        .action-btn.delete:hover {
            background: rgba(107, 114, 128, 1);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            z-index: 20;
        }

        .fab:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-50%) scale(1.05);
        }

        .fab:active {
            transform: translateX(-50%) scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-group input,
        .form-group input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group input[type="datetime-local"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .context-menu {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 500;
            min-width: 150px;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .context-menu button:last-child {
            border-bottom: none;
        }

        .context-menu button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .context-menu button.delete {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Predictions</h1>
        </div>

        <div class="predictions-list" id="predictionsList">
            <div class="empty-state">No predictions yet. Create one to get started!</div>
        </div>
    </div>

    <button class="fab" id="addBtn" title="Add new prediction">+</button>

    <!-- New Prediction Modal -->
    <div class="modal" id="newPredictionModal">
        <div class="modal-content">
            <div class="modal-header">New Prediction</div>
            <form id="predictionForm">
                <div class="form-group">
                    <label for="titleInput">Prediction</label>
                    <input type="text" id="titleInput" placeholder="Enter your prediction" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closePredictionModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Prediction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <button onclick="markCorrect(currentPredictionId)">✅ Mark Correct</button>
        <button onclick="markIncorrect(currentPredictionId)">❌ Mark Incorrect</button>
        <button onclick="markPending(currentPredictionId)">⏳ Mark Pending</button>
        <button class="delete" onclick="deletePrediction(currentPredictionId)">🗑️ Delete</button>
    </div>

    <script>
        let currentPredictionId = null;
        let predictions = [];

        const statusEmojis = {
            '✅': '✅',
            '❌': '❌',
            '⏳': '⏳'
        };

        // Load predictions from storer.json with localStorage fallback
        async function loadPredictions() {
            try {
                const response = await fetch('storer.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data && Array.isArray(data)) {
                        predictions = data;
                        // Update localStorage cache
                        localStorage.setItem('predictions', JSON.stringify(predictions));
                        return;
                    }
                }
            } catch (error) {
                console.warn('Failed to load from storer.json, falling back to localStorage:', error);
            }

            // Fallback to localStorage if storer.json is unavailable
            const saved = localStorage.getItem('predictions');
            if (saved) {
                try {
                    predictions = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse localStorage predictions:', e);
                    predictions = [];
                }
            }
        }

        // Save predictions to both storer.json and localStorage
        async function savePredictions() {
            // Save to localStorage (for offline access)
            localStorage.setItem('predictions', JSON.stringify(predictions));

            // Save to storer.json (server-side storage)
            try {
                await fetch('storer.json', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(predictions)
                });
            } catch (error) {
                console.warn('Failed to save to storer.json, changes saved to localStorage only:', error);
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Render predictions
        function renderPredictions() {
            const list = document.getElementById('predictionsList');
            
            if (predictions.length === 0) {
                list.innerHTML = '<div class="empty-state">No predictions yet. Create one to get started!</div>';
                return;
            }

            list.innerHTML = predictions.map((prediction) => `
                <div class="prediction-row" onclick="showContextMenu(event, '${prediction.id}')">
                    <div class="prediction-content">
                        <div class="prediction-title">${escapeHtml(prediction.title)}</div>
                        <div class="prediction-date">${formatDate(prediction.created)}</div>
                    </div>
                    <div class="prediction-icon">${statusEmojis[prediction.status]}</div>
                </div>
            `).join('');
        }

        // Show context menu
        function showContextMenu(event, id) {
            event.preventDefault();
            currentPredictionId = id;
            const menu = document.getElementById('contextMenu');
            menu.classList.add('active');
            menu.style.left = event.pageX + 'px';
            menu.style.top = event.pageY + 'px';
        }

        // Hide context menu
        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('active');
        }

        // Mark prediction as correct
        function markCorrect(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '✅';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Mark prediction as incorrect
        function markIncorrect(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '❌';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Mark prediction as pending
        function markPending(id) {
            const prediction = predictions.find(p => p.id === id);
            if (prediction) {
                prediction.status = '⏳';
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Delete prediction
        function deletePrediction(id) {
            if (confirm('Delete this prediction?')) {
                predictions = predictions.filter(p => p.id !== id);
                savePredictions();
                renderPredictions();
                triggerHaptic();
            }
            hideContextMenu();
        }

        // Haptic feedback (vibration on supported devices)
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        // Open new prediction modal
        document.getElementById('addBtn').addEventListener('click', () => {
            document.getElementById('newPredictionModal').classList.add('active');
            document.getElementById('titleInput').focus();
        });

        // Close modal
        function closePredictionModal() {
            document.getElementById('newPredictionModal').classList.remove('active');
        }

        // Handle form submission
        document.getElementById('predictionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('titleInput').value.trim();

            if (title) {
                predictions.push({
                    id: Date.now().toString(),
                    title: title,
                    created: new Date().toISOString(),
                    status: '⏳'
                });

                savePredictions();
                renderPredictions();
                triggerHaptic();

                document.getElementById('titleInput').value = '';
                closePredictionModal();
            }
        });

        // Close modal when clicking outside
        document.getElementById('newPredictionModal').addEventListener('click', (e) => {
            if (e.target.id === 'newPredictionModal') {
                closePredictionModal();
            }
        });

        // Close context menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.prediction-row') && !e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        // Initialize
        loadPredictions().then(() => {
            renderPredictions();
        });
    </script>
</body>
</html>
