<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>ImRight — Predictions</title>
<link rel="apple-touch-icon" href="/favicon.ico" type="image/x-icon"/>
<style>
:root{
--bg:#071022; --card:#0b1220; --muted:#9aa4b2; --accent:#60a5fa; --accent-contrast:#072033; --success:#34d399; --danger:#fb7185;
--glass: rgba(255,255,255,0.03);
font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
--radius:12px;
}
/* Mobile-first styles */
html,body{height:100%; margin:0; background:linear-gradient(180deg,var(--bg) 0%, #081426 100%); color:#e6eef8; -webkit-font-smoothing:antialiased;}
/* Blue top layer to cover status/address bar white gaps on mobile */
.top-layer{
position:fixed;
left:0;
right:0;
top:0;
height:calc(env(safe-area-inset-top, 0px) + 12px);
background:var(--bg);
pointer-events:none;
z-index:1;
}
/* Make wrap sit above the top-layer and fill the viewport (subtracting vertical margins) so there's no white space at the bottom */
.wrap{min-height:calc(100vh - 24px); display:flex; flex-direction:column; max-width:720px;margin:12px auto;padding:16px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:var(--radius); box-shadow:0 6px 20px rgba(2,6,23,0.6); position:relative; z-index:2;} /* Header removed per request; keep compact spacing */
</style>
</head>
<body>
</body>
</html>
